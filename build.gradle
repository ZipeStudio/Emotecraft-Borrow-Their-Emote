import net.lopymine.utils.MossyUtils

plugins {
    id "net.lopymine.mossy-plugin-core" version "$mossy_plugin_version"
}

mossyDependencies {
    minecraft = stonecutter.current.project.substring(stonecutter.current.project.indexOf("-") + 1)
    lombok = prop("base.lombok_version")

    fabricApi = prop("build.fabric_api")
    fabricLoader = prop("build.fabric_loader")

    forge = prop("build.forge")

    neoForge = prop("build.neoforge")
    parchment = prop("build.parchment")

    additional {
        // TIP: Don't use modImplementation, use mossyImplementation and etc.
//        disable("emotecraft")
    }
}

mossyResources {
    //expandFiles = ["file pattern"]
    customProperty("mossylib_version", MossyUtils.substringBefore(prop("dep.mossylib"), "+"))
}

repositories {

    mavenCentral()

    // Emotecraft
    maven { url = "https://maven.kosmx.dev/" }
    // Player Animation Library
    maven { url = "https://repo.redlance.org/public" }

}

dependencies {

    if (prop("dep.emotecraft") != "unknown") {
        String emotecraft = MossyUtils.substringBefore(prop("dep.emotecraft"), "+")
        List<String> ver = emotecraft.tokenize(".")
        int major = ver[0] as int
        int minor = ver.size() > 1 ? (ver[1].replaceAll("[^0-9].*", "") as int) : 0
        String mainModule = (major == 2 && minor <= 4) ? "emotesExecutor" : "archCommon"

        Closure emoteExcludes = {
            exclude group: "net.raphimc"
            exclude group: "net.fabricmc", module: "fabric-loader"

            exclude group: "com.google.code.gson"
            exclude group: "org.slf4j"
            exclude group: "io.netty"
            exclude group: "org.joml"
            exclude group: "it.unimi.dsi"
        }

        implementation("io.github.kosmx.emotes:emotesAPI:${emotecraft}", emoteExcludes)
        implementation("io.github.kosmx.emotes:${mainModule}:${emotecraft}", emoteExcludes)
    }

}

afterEvaluate {
    publishMods {
        displayName = displayName.get().replace(" (EBTE)", "")
    }
}

String prop(String key) {
    return findProperty(key).toString()
}
