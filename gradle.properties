# # # # # # # # # # # # # #
#    Project Properties   #
# # # # # # # # # # # # # #

# Gradle Settings
org.gradle.jvmargs=-Xmx10G
org.gradle.parallel=true

# Mossy Plugin
mossy_plugin_version = 3.21.0

# Data Properties
data.mod_id = emotecraft_borrow_their_emote
data.mod_slug = emotecraft-borrow-their-emote
data.mod_name = Emotecraft: Borrow Their Emote (EBTE)
data.mod_jar_name = emotecraft-borrow-their-emote
data.mod_version = 1.0.1
data.mod_group = me.zipestudio.ebte
data.mod_maven_group = me.zipestudio
data.mixin_configs = none
data.sides = client

data.mod_description = Client-side addon for Emotecraft, that lets you borrow another player's emote and play it together.
data.mod_authors = ZipeStudio
data.github_author = ZipeStudio
data.mod_license = CC-BY-ND 4.0

# Base Properties
base.lombok_version = 1.18.42
base.mixinextras_version = 0.4.1
base.mixin_version = 0.8.5

# Per-Loader Versions
fabric.multi_versions = 1.20.1 1.21.1 1.21.11 26.1 26.2
neoforge.multi_versions = 1.21.1 1.21.11 26.1 26.2
forge.multi_versions = 1.20.1

# Mod Loaders
mod_loaders = fabric neoforge forge

# Build Properties
build.fabric_loader = 0.19.2
build.fabric_api = [VERSIONED]
build.neoforge = [VERSIONED]
build.forge = [VERSIONED]
build.parchment = [VERSIONED]

# Additional Dependencies, "dep." is important
dep.mossylib = [VERSIONED]
dep.yacl = [VERSIONED]
dep.modmenu = [VERSIONED]
dep.emotecraft = [VERSIONED]

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

# Supported Versions, 1.21[1] -> 1.21-1.21.1
fabric.versions_specifications = 1.21.10 26.1[26.1.2]
neoforge.versions_specifications = 1.21.10 26.1[26.1.2]
forge.versions_specifications = 1.20.1

# Version Type [RELEASE, BETA, ALPHA]
version_type = RELEASE

# Imitation of Publishing. Set to "true" for testing
test_publish = false

# Project IDs
modrinth_id = KM1YbXvb
curseforge_id = 1590584

# CurseForge Settings
is_for_client = true
is_for_server = false
max_java_version = 21

# Fabric Dependencies
fabric.depends_requires = fabric-api mossylib
fabric.depends_optional = modmenu yacl
fabric.depends_incompatible = none
fabric.depends_embeds  = none

# NeoForge Dependencies
neoforge.depends_requires = mossylib
neoforge.depends_optional = yacl
neoforge.depends_incompatible = none
neoforge.depends_embeds  = none

# Forge Dependencies
forge.depends_requires = mossylib
forge.depends_optional = yacl
forge.depends_incompatible = none
forge.depends_embeds  = none

# Stonecutter Stuff
dev.kikugie.stonecutter.hard_mode=true
